[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "extraction"
version = "0.1.0"
description = "Clinical Trial Intelligence Platform - Extraction"
requires-python = ">=3.12"

dependencies = [
    "pymupdf==1.28.2",
    "utils",
    "aws_utils"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

markers = [
    "unit: fast isolated unit tests",
    "component: service and worker component tests",
    "integration: local integration tests using real files",
    "performance: slower resource and scalability tests",
    "aws: post-deployment tests using real AWS services",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.uv.sources]
utils = { path = "../../packages/utils" }
aws_utils = { path = "../../packages/aws_utils" }