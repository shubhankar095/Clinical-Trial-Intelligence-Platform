[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestion"
version = "0.1.0"
description = "Clinical Trial Intelligence Platform - Ingestion"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "huggingface-hub",
    "numpy",
    "utils",
    "aws_utils",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

markers = [
    "unit: fast isolated unit tests",
    "component: real application components with source-compatible fakes",
    "contract: producer-consumer schema compatibility",
    "integration: local containers or service emulators",
    "resilience: failure, replay, ownership, and recovery behavior",
    "performance: deterministic throughput and latency budgets",
    "aws: deployed AWS resources required",
    "local: no deployed AWS resources",
    "smoke: short deployed environment verification",
    "e2e: complete deployed ingestion workflow",
    "slow: excluded from the default local gate",
    "destructive: may alter or terminate deployed test resources",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.uv.sources]
utils = { path = "../../packages/utils" }
aws_utils = { path = "../../packages/aws_utils" }