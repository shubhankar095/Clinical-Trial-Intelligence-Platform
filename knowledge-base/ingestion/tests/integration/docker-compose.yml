services:
  localstack:
    image: localstack/localstack:4.8
    environment:
      SERVICES: s3,sqs,dynamodb
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb list-tables >/dev/null && awslocal sqs list-queues >/dev/null && awslocal s3api list-buckets >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s