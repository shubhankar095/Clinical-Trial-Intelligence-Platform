[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws_utils"
version = "0.1.0"
description = "Shared platform utilities"
requires-python = ">=3.12"

dependencies = [
    "boto3==1.43.98"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools]
packages = ["aws_utils"]